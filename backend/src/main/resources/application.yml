server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: document-verification-assistant
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

docverify:
  # ── Assistance mode ───────────────────────────────────────────────
  # Single mode for every caller (OFF / HINT / FULL). For per-user modes,
  # provide your own AssistModeResolver bean (see README).
  assist:
    mode: ${DOCVERIFY_ASSIST_MODE:FULL}

  # ── AWS Bedrock ───────────────────────────────────────────────────
  # WARNING: enabling this incurs AWS charges per analysed document and
  # SENDS DOCUMENT IMAGES (which may contain personal data) to Amazon Bedrock
  # in the configured region. Disabled by default.
  #
  # Model families supported: Amazon Nova (amazon.nova-*) and Anthropic Claude
  # (anthropic.* / <geo>.anthropic.*). Token rates below include a 100% safety
  # margin over the Amazon Nova Pro list price ($0.0008 in / $0.0032 out per 1K).
  #
  # credentials-source: "default" (static keys if set, else the AWS SDK default
  # chain) or "instance-profile" (always use the EC2 instance role).
  bedrock:
    enabled: ${DOCVERIFY_BEDROCK_ENABLED:false}
    region: ${DOCVERIFY_BEDROCK_REGION:eu-west-2}
    model-id: ${DOCVERIFY_BEDROCK_MODEL_ID:amazon.nova-pro-v1:0}
    access-key: ${DOCVERIFY_BEDROCK_ACCESS_KEY:}
    secret-key: ${DOCVERIFY_BEDROCK_SECRET_KEY:}
    credentials-source: ${DOCVERIFY_BEDROCK_CREDENTIALS_SOURCE:default}
    max-file-bytes: ${DOCVERIFY_BEDROCK_MAX_FILE_BYTES:15728640}
    max-pages: ${DOCVERIFY_BEDROCK_MAX_PAGES:3}
    max-output-tokens: ${DOCVERIFY_BEDROCK_MAX_OUTPUT_TOKENS:1500}
    input-cost-per-1k-tokens-usd: ${DOCVERIFY_BEDROCK_INPUT_COST_PER_1K_USD:0.0016}
    output-cost-per-1k-tokens-usd: ${DOCVERIFY_BEDROCK_OUTPUT_COST_PER_1K_USD:0.0064}
